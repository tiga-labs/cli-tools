version: 2

project_name: cli-tools

before:
  hooks:
    - go test ./...

builds:
  - id: enrich
    main: ./cmd/enrich
    binary: enrich
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  # Add future CLI tools under cmd/<tool> here:
  # - id: another-tool
  #   main: ./cmd/another-tool
  #   binary: another-tool
  #   env:
  #     - CGO_ENABLED=0
  #   goos: [darwin, linux]
  #   goarch: [amd64, arm64]
  #   ldflags:
  #     - -s -w -X main.version={{.Version}}

# Publish raw binaries (no tar/zip) with unversioned names, so install.sh can always fetch
# https://github.com/tiga-labs/cli-tools/releases/latest/download/<tool>-<os>-<arch>
archives:
  - id: binaries
    formats: ["binary"]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: tiga-labs
    name: cli-tools
  extra_files:
    - glob: ./install.sh

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
